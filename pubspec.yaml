name: biometric_auth_login
description: >-
  Backend-agnostic biometric (Face ID / Touch ID / fingerprint) unlock gate with
  secure secret storage and a ready-made login button for Flutter.
version: 1.1.0
homepage: https://github.com/HadyEldod/biometric_login
repository: https://github.com/HadyEldod/biometric_login
issue_tracker: https://github.com/HadyEldod/biometric_login/issues

topics:
  - authentication
  - biometrics
  - security
  - local-auth
  - secure-storage

platforms:
  android:
  ios:
  macos:
  windows:

environment:
  sdk: '>=2.17.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  # local_auth 3.x is required: the package uses the 3.x LocalAuthException API.
  local_auth: '>=3.0.0 <4.0.0'
  flutter_secure_storage: '>=9.0.0 <12.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
